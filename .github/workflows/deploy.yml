# main ブランチに push されるたびに、テスト → ビルド → GitHub Pages へ公開する。
# 事前にリポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動でも実行できる
  workflow_dispatch:

# Pages への公開に必要な最小限の権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重なったら、実行中のものは止めずに新しいものを待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # テストに失敗したら公開しない
      - name: Test
        run: npm test

      # 型チェックを含むビルド（vite.config.ts の base: './' により、サブパスでもそのまま動く）
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
